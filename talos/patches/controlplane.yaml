# Applied to talos-cp-1 only.
machine:
  type: controlplane
  certSANs:
    - talos-cp-1
    - 192.168.178.239
  # Restore the control-plane role label (the KubeNodeConfig document is
  # removed below). Do not set
  # node.kubernetes.io/exclude-from-external-load-balancers: MetalLB must
  # advertise the VIP from this single control-plane node.
  nodeLabels:
    node-role.kubernetes.io/control-plane: ""
  network:
    interfaces:
      - interface: ens18
        addresses:
          - 192.168.178.239/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.178.1
cluster:
  # Single control plane: allow workloads on it.
  allowSchedulingOnControlPlanes: true
  etcd:
    extraArgs:
      # etcd only reads this at start, so changing it needs a reboot.
      listen-metrics-urls: http://192.168.178.239:2381
---
# Drop the generated KubeNodeConfig document. Keeping it makes
# cluster.allowSchedulingOnControlPlanes a conflict, and its control-plane
# taint cannot be deleted with a patch because Talos adds it afterwards.
apiVersion: v1alpha1
kind: KubeNodeConfig
$patch: delete
---
# HostnameConfig defaults to auto: stable, which conflicts with a static name.
apiVersion: v1alpha1
kind: HostnameConfig
auto:
  $patch: delete
hostname: talos-cp-1
---
# Talos 1.14 moved the control-plane component settings out of `.cluster` into
# dedicated documents; the deprecated fields are rejected once these documents
# exist on the node. Bind metrics to the node address, not 0.0.0.0.
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0
